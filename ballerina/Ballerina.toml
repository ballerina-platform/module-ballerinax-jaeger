[package]
org = "ballerinax"
name = "jaeger"
version = "1.2.0"
keywords = ["Type/Driver", "Area/Developer Tools", "Vendor/Jaeger", "Observability", "tracing"]
distribution = "2201.14.0"

[build-options]
# Pin dependency resolution to the versions in Dependencies.toml: the build
# compiles against a distribution assembled by copyStdlibs from the stdlib
# versions in gradle.properties, so letting bal resolve to the latest on
# Central would drift out of sync with the merged balas.
sticky = true

[platform.java21]
graalvmCompatible = true

[[platform.java21.dependency]]
path = "../native/build/libs/jaeger-extension-native-1.2.0.jar"
groupId = "ballerina"
artifactId = "jaeger-extension-native"
version = "1.2.0"

