# ballerina/observe + the internal ballerinai/observe module must be bundled
# into the distribution copyStdlibs merges (unlike jaeger's other test
# dependencies, which resolve fine from Central): without ballerinai/observe
# specifically, compiling jaeger-server-tests (which sets
# observabilityIncluded = true) crashes the compiler with a NullPointerException
# in DeclarativeAuthDesugar (ballerina-lang#35216) instead of failing cleanly.
observeVersion=1.7.1
observeInternalVersion=1.7.1

