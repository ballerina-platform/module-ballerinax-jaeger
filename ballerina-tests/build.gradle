import org.apache.tools.ant.taskdefs.condition.Os
import org.gradle.process.ExecOperations

import javax.inject.Inject

abstract class BallerinaExecHelper {
    @Inject abstract ExecOperations getExecOperations()
}

description = 'Ballerina - Jaeger Extension - Ballerina Tests'

jar {
    manifest {
        attributes('Implementation-Title': project.name, 'Implementation-Version': project.version)
    }
}

def groupParams = ""
def disableGroups = ""
def windowsDisableGroups = "--disable-groups disabledOnWindows"
def debugParams = ""
def balJavaDebugParam = ""
def testParams = "--code-coverage --coverage-format=xml"
def nativeFlag = ""
def ballerinaDockerTag = ""

def packageOrg = "ballerinax"
def packageName = "jaeger"
def tomlVersion = stripBallerinaExtensionVersion("${project.version}")
def testPackages = ["jaeger-server-tests"]

// Only used for -PuseLocalBal: the same distribution unpackJballerinaTools
// extracts for :jaeger-extension-ballerina:build (not whatever `bal` happens
// to be on PATH), so these tests resolve the locally-published
// ballerinax/jaeger bala with a matching Ballerina version.
def balDistributionBin = "${project.rootDir}/ballerina/build/jballerina-tools-${ballerinaLangVersion}/bin"
// Shared with the host so the containerized `bal` sees the bala
// :jaeger-extension-ballerina:publishBalaFileToLocal pushed to the 'local'
// repository, plus the Central download cache (avoids re-pulling every run).
def ballerinaHomeDir = "${System.getProperty('user.home')}/.ballerina"

def ballerinaTestTomlFile = new File("${project.projectDir}/jaeger-server-tests/Ballerina.toml")
def ballerinaTestTomlFilePlaceHolder = new File("${project.rootDir}/build-config/resources/tests/Ballerina.toml")

def stripBallerinaExtensionVersion(String extVersion) {
    if (extVersion.matches(project.ext.timestampedVersionRegex)) {
        def splitVersion = extVersion.split('-');
        if (splitVersion.length > 3) {
            def strippedValues = splitVersion[0..-4]
            return strippedValues.join('-')
        } else {
            return extVersion
        }
    } else {
        return extVersion.replace("${project.ext.snapshotVersion}", "")
    }
}

def skipTests = false

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(":jaeger-extension-tests:ballerinaTest")) {
        skipTests = true
    }
}

// jaeger's own ballerinaLangVersion is a timestamped snapshot (matches
// ext.timestampedVersionRegex), which has no matching `ballerina/ballerina`
// image tag; the 'nightly' tag is the closest available image in that case.
// A stable, non-snapshot langVersion would resolve to an exact tag instead.
static boolean isTimeStampVersion(String version) {
    return version.trim().split("-").length > 1
}

static String resolveDockerTag(Project project, String ballerinaLangVersion) {
    if (project.hasProperty('buildUsingDocker')) {
        def tag = project.findProperty('buildUsingDocker')
        return tag == '' ? 'nightly' : tag
    }
    return isTimeStampVersion(ballerinaLangVersion) ? 'nightly' : ballerinaLangVersion
}

task initializeVariables {
    if (project.hasProperty("groups")) {
        groupParams = "--groups ${project.findProperty("groups")}"
    }
    if (project.hasProperty("disable")) {
        disableGroups = "--disable-groups ${project.findProperty("disable")}"
    }
    if (project.hasProperty("debug")) {
        debugParams = "--debug ${project.findProperty("debug")}"
    }
    if (project.hasProperty("balJavaDebug")) {
        balJavaDebugParam = "BAL_JAVA_DEBUG=${project.findProperty("balJavaDebug")}"
    }
    if (project.hasProperty('balNativeTest')) {
        nativeFlag = '--native'
    }
    if (project.hasProperty('balTests')) {
        testPackages = project.findProperty('balTests').toString().split(",")
    }
    if (project.hasProperty('skipBalTests')) {
        project.findProperty('skipBalTests').toString().split(",").each {testPackage ->
            testPackages.remove(testPackage)
        }
    }
    if (!project.hasProperty('useLocalBal')) {
        ballerinaDockerTag = resolveDockerTag(project, ballerinaLangVersion)
        println("[Info] running jaeger-server-tests against the ballerina/ballerina:${ballerinaDockerTag} Docker image")
    } else {
        println("[Info] running jaeger-server-tests against the local Ballerina distribution")
    }
}

task updateTomlVerions {
    dependsOn ":jaeger-extension-ballerina:build"

    doLast {
        def newConfig = ballerinaTestTomlFilePlaceHolder.text.replace("@toml.version@", tomlVersion)
        ballerinaTestTomlFile.text = newConfig
    }
}

task startJaegerServer() {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    dependsOn ":jaeger-extension-ballerina:build"

    doLast {
        // This check is added to prevent starting the server in Windows OS, since the Docker image does not support
        // for Windows OS.
        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            def stdOut = new ByteArrayOutputStream()
            execHelper.execOperations.exec {
                commandLine 'sh', '-c', "docker ps --filter name=jaeger-server"
                standardOutput = stdOut
            }
            if (!stdOut.toString().contains("jaeger-server")) {
                println "Starting Jaeger server."
                execHelper.execOperations.exec {
                    commandLine 'sh', '-c', "docker compose -f $project.projectDir/resources/jaeger-server/docker-compose.yml up -d"
                    standardOutput = stdOut
                }
                println stdOut.toString()
                println "Waiting 15s until the Jaeger server get initiated."
                sleep(15 * 1000)
            } else {
                println "Jaeger server is already started."
            }
        }
    }
}

task stopJaegerServer() {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    doLast {
        // This check is added to prevent trying to stop the server in Windows OS, since the Docker image not started
        // in Windows OS.
        if (!Os.isFamily(Os.FAMILY_WINDOWS)) {
            def stdOut = new ByteArrayOutputStream()
            execHelper.execOperations.exec {
                commandLine 'sh', '-c', "docker ps --filter name=jaeger-server"
                standardOutput = stdOut
            }
            if (stdOut.toString().contains("jaeger-server")) {
                println "Stopping LDAP server."
                execHelper.execOperations.exec {
                    commandLine 'sh', '-c', "docker stop jaeger-server"
                    standardOutput = stdOut
                }
                println stdOut.toString()
                println "Waiting 5s until the Jaeger server get stopped."
                sleep(5 * 1000)
            } else {
                println "Jaeger server is not started."
            }
        }
    }
}

task ballerinaTest {
    def execHelper = project.objects.newInstance(BallerinaExecHelper)
    dependsOn ":jaeger-extension-ballerina:build"
    dependsOn ":jaeger-extension-ballerina:publishBalaFileToLocal"
    dependsOn initializeVariables
    dependsOn updateTomlVerions
    dependsOn startJaegerServer

    finalizedBy(stopJaegerServer)

    doLast {
        testPackages.each { testPackage ->
            def testPackageDir = "${project.projectDir}/${testPackage}"
            if (project.hasProperty('useLocalBal')) {
                execHelper.execOperations.exec {
                    workingDir testPackageDir
                    environment "JAVA_OPTS", "-DBALLERINA_DEV_COMPILE_BALLERINA_ORG=true ${groupParams}" +
                            " ${disableGroups} ${windowsDisableGroups} ${debugParams}"
                    if (Os.isFamily(Os.FAMILY_WINDOWS)) {
                        commandLine 'cmd', '/c', "${balDistributionBin}/bal.bat test ${testParams} && exit %%ERRORLEVEL%%"
                    } else {
                        commandLine 'sh', '-c', "${balDistributionBin}/bal test ${testParams}"
                    }
                }
            } else {
                // --net=host lets the containerized `bal test` reach the
                // jaeger-server container's ports on localhost; the .ballerina
                // mount shares the locally-published ballerinax/jaeger bala
                // and the Central download cache with the container.
                // -u root is needed to write test output/coverage back to the
                // host-owned mounted directories. Passing -e HOME=... does NOT
                // work here: Java's user.home (which `bal` uses to find its
                // repo dir) is resolved from the OS user database for the
                // running uid, not from $HOME - and root's entry is /root
                // regardless of the HOME env var - so the mount target is
                // /root/.ballerina, not the image's normal /home/ballerina.
                execHelper.execOperations.exec {
                    environment "DOCKER_DEFAULT_PLATFORM", "linux/amd64"
                    environment "JAVA_OPTS", "-DBALLERINA_DEV_COMPILE_BALLERINA_ORG=true ${groupParams}" +
                            " ${disableGroups} ${windowsDisableGroups} ${debugParams}"
                    commandLine 'docker', 'run', '--rm', '--net=host', '-u', 'root',
                            '-v', "${ballerinaHomeDir}:/root/.ballerina",
                            '-v', "${testPackageDir}:/home/ballerina/${testPackage}",
                            '-w', "/home/ballerina/${testPackage}",
                            "ballerina/ballerina:${ballerinaDockerTag}",
                            'bal', 'test', *testParams.split(/\s+/)
                }
            }
        }
    }
}

test.dependsOn ballerinaTest

clean {
    delete "${project.projectDir}/target"
    delete "${project.projectDir}/Ballerina.lock"
    delete "${project.projectDir}/ballerina-internal.log"
}
